name: Build Khelo Tournament APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build User and Admin APKs
        working-directory: project
        run: |
          gradle :android-user-app:assembleRelease :android-admin-app:assembleRelease --no-daemon

      - name: Prepare APK files
        working-directory: project
        run: |
          mkdir -p output
          cp android-user-app/app/build/outputs/apk/release/app-release.apk output/Khelo-Tournament-User.apk
          cp android-admin-app/app/build/outputs/apk/release/app-release.apk output/Khelo-Tournament-Admin.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: khelo-tournament-apks
          path: project/output/*.apk
